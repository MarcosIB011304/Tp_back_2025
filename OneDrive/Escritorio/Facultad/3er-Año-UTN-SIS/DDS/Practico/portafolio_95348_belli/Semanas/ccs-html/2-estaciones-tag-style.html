<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Estaciones</title>
    <style>
        body {
            background-color: lightblue;
        }

        table {
            padding: 10px;
            background-color: #e9d66b;
            border: 5px;
            width: 100%;
        }

        h3 {
            color: white;
            text-align: center;
        }
        #filtros {
            margin: 10px;
            background-color: #76eec6;
        }
    </style>
</head>

<body>
    <h3>Lista de Estaciones - Tag Styles</h3>
    <hr width="90%" align="left">
    <form action="servidor" method="get">
        <table id="filtros" width="70%">
            <tr>
                <td>
                    <label for="texto">Texto:</label><br>
                    <input type="text" name="texto" id="texto" placeholder="Texto a filtrar">
                </td>
                <td>
                    <label for="barrio">Barrio:</label><br>
                    <select name="barrio" id="barrio">
                        <option value="1">Barrio 1</option>
                        <option value="2">Barrio 2</option>
                        <option value="3">Barrio 3</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>
                    <input type="checkbox" name="inactivos" id="inactivos"> Incluir Inactivos
                </td>
                <td align="right">
                    <input type="button" value="Filtrar">
                </td>
            </tr>
        </table>
    </form>

    <hr width="90%" align="left">
    <table border="1px" width="90%">
        <thead>
            <tr>
                <th>Nro</th>
                <th>Nombre </th>
                <th>DirecciÃ³n </th>
                <th>Barrio</th>
                <th>Activo</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td> 1</td>
                <td>Contenido 2</td>
                <td>Contenido 3</td>
                <td>Contenido 4</td>
                <td>Contenido 5</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Contenido 2</td>
                <td>Contenido 3</td>
                <td>Contenido 4</td>
                <td>Contenido 5</td>
            </tr>
            <tr>
                <td>3</td>
                <td>Contenido 2</td>
                <td>Contenido 3</td>
                <td>Contenido 4</td>
                <td>Contenido 5</td>
            </tr>
        </tbody>
    </table>
</body>

</html>
